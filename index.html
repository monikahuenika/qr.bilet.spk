<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>qr.bilet.nspk.ru/result?</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="QR Bilet">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
</head>
<body>
<main class="head">
    <header class="box-head"><h1 class="box-head__title">Уведомление об оплате</h1></header>
    <div class="ticket-body">
    <div class="imgSbp">
        <img src="img/image.png" alt="СБП">
    </div>
    <div class="winBay">Ваш проезд успешно оплачен!</div>
    <div class="busNumber">
        <span id="car">Автобус:</span> <div id="textRedactor">№<span id="numberCar">71</span><input
                    type="text"
                    id="impunFl"
            >
        </div>
    </div>
    <div class="menuCar" id="menuCar">
        <button class="btnMenu" id="btnMenuOne">Трамвай</button>
        <button class="btnMenu" id="btnMenuTwo">Троллейбус</button>
        <button class="btnMenu" id="btnMenuThree">Автобус</button>
    </div>
    <div class="numberRub">42&nbsp;<span class="twoNine">₽</span></div>
    <div class="dataAndNowTime"><span id="DataTime">Дата</span></div>
    <div class="tc" id="tc">
        Т/C: <span id="tcValue">1240</span>
        <input type="text" id="tcInput">
    </div>

    <div class="timeOldText">С момента оплаты прошло:</div>
    <div class="timeOldNumber"><span id="timeOldNumber">Время</span></div>
    <div class="QR-code">
        <img src="img/qr-code.png" alt="QR-code">
    </div>
    <!-- boxStartQr: блок «Сохранить билет» скрыт по требованию (не отображается в референсе).
    <div class="boxStartQr" id="boxStartQr">
        <div class="btnSaveTiketClassStart">
            <div class="btnSaveTiketClassStartText">Ваша поездка оплачена, пожалуйста, сохраните билет</div>
            <div class="btnSaveTiketClassStartTextTwo">в памяти телефона до конца поездки</div>
            <button class="btnSaveTiketStart" id="btnSaveTiketStart">Сохранить билет</button>
        </div>
    </div>
    -->
    <div class="seriesTikets">Cерия билета:&nbsp;<span class="numberSeriesTikets">QR361012088790</span></div>
    <div class="numberTiket">Номер билета:&nbsp;<span class="numberTiketNam">202503356708013913</span></div>
    <div class="textFooter">
        Предявите контролеру QR-код.
        <div class="textFooterTwo">Чтобы сохранить реквизиты билета,</div>
        <div class="textFooterThree">нажмите кнопку «Скачать»</div>
    </div>
    <div class="btnSaveTiketClass">
        <button class="btnSaveTiket" id="btnDownloadTicket">Скачать билет</button>
    </div>
    </div>
</main>

<!-- Модальное окно редактирования Т/С -->
<div class="tcEditorModal" id="tcEditorModal">
    <div class="tcEditorOverlay" id="tcEditorOverlay"></div>
    <div class="tcEditorContent">
        <div class="tcEditorTitle">Введите номер Т/С</div>
        <input type="text" class="tcEditorInput" id="tcEditorInput" inputmode="numeric" pattern="[0-9]*">
        <div class="tcEditorButtons">
            <button class="tcEditorBtn tcEditorBtnCancel" id="tcEditorBtnCancel">Отмена</button>
            <button class="tcEditorBtn tcEditorBtnSave" id="tcEditorBtnSave">Сохранить</button>
        </div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
